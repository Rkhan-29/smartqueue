spring:
  application:
    name: smartqueue
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smartqueue}
    username: ${DB_USERNAME:smartqueue}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  # "native" makes Tomcat resolve the real client IP from X-Forwarded-For when behind a trusted proxy
  # (needed for per-IP rate limiting and audit IPs on Render/Railway/nginx).
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

smartqueue:
  jwt:
    # Required. Generate with: openssl rand -base64 48
    secret: ${JWT_SECRET}
    access-token-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    refresh-token-ttl-days: ${JWT_REFRESH_TTL_DAYS:7}
    issuer: smartqueue
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:5173}
  security:
    login-max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
    login-lockout-minutes: ${LOGIN_LOCKOUT_MINUTES:15}
    rate-limit-per-minute: ${AUTH_RATE_LIMIT_PER_MINUTE:20}
    join-rate-limit-per-minute: ${JOIN_RATE_LIMIT_PER_MINUTE:30}
  seed:
    enabled: false
